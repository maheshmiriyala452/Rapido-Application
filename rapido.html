<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapido - India's #1 Ride-hailing App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Standard Navigation Bar (No sticky class) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand" href="#">
                <span class="rapido-logo">rapido</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto fw-semibold">
                    <li class="nav-item">
                        <a class="nav-link active-link" href="#">Home</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Safety</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Careers</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Press</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact Us</a></li>
                </ul>
                <button class="btn btn-dark rounded-pill px-4 fw-bold">Download App</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section mt-5">
        <div class="container">
            <div class="row align-items-center">
                
                <!-- Left Content -->
                <div class="col-lg-6 pe-lg-5">
                    <h1 class="hero-title">India's #1<br>Ride-hailing App</h1>
                    <p class="hero-subtitle mt-3 mb-4">Quick, Affordable rides at your doorstep</p>
                    
                    <form id="rideForm" class="booking-form pe-lg-5">
                        <div class="input-group mb-3 custom-input">
                            <span class="input-group-text bg-white border-0"><i class="fa-solid fa-location-dot text-dark"></i></span>
                            <input type="text" id="pickup" class="form-control border-0 shadow-none" placeholder="Enter Pickup Location" required>
                        </div>
                        
                        <div class="input-group mb-4 custom-input">
                            <span class="input-group-text bg-white border-0"><i class="fa-regular fa-circle-dot text-dark"></i></span>
                            <input type="text" id="drop" class="form-control border-0 shadow-none" placeholder="Enter Drop Location" required>
                        </div>
                        
                        <button type="submit" class="btn btn-book w-100 py-3 rounded-3 fw-bold fs-5">Book Ride</button>
                    </form>
                </div>
                
                <!-- Right Content -->
                <div class="col-lg-6 mt-5 mt-lg-0 text-center">
                    <img src="./assessts/image.png" alt="Rapido Vehicles" class="img-fluid hero-image">
                </div>

            </div>
        </div>
    </section>

    <!-- Spacer removed as sticky nav is no longer applied -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
